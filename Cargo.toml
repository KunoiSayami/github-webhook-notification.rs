[package]
name = "github-webhook-notification"
version = "5.0.0"
edition = "2024"
description = "A webhook server that forwards GitHub webhook events to Telegram. Usable as a standalone binary or embedded as a library."
license = "AGPL-3.0"
repository = "https://github.com/KunoiSayami/github-webhook-notification.rs"
readme = "README.md"

[lib]
name = "github_webhook_notification"
path = "src/lib.rs"

[[bin]]
name = "github-webhook-notification"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.56"
axum = "0.8"
axum-server = "0.8"
clap = "4"
env_logger = "0.11"
hex = "0.4.3"
hmac = "0.13"
http-body-util = "0.1.3"
log = { version = "0.4", features = [
    "max_level_trace",
    "release_max_level_debug",
] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
sha2 = "0.11"
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
teloxide-macros = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

[profile.release]
lto = true
panic = "abort"

[dev-dependencies]
walkdir = "2.3"
